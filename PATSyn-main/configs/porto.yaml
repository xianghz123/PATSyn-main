# ============================================================
# Porto dataset configuration
# This file overrides dataset-specific values in default.yaml
# ============================================================

dataset:
  name: "porto"
  type: "real"
  area: "Porto"

  # Formal experimental cohort used in the paper
  num_trajectories: 100000

  # Target number of synthetic trajectories
  num_synthetic: 100000

# ------------------------------------------------------------
# Data paths
# ------------------------------------------------------------
paths:
  # Raw Porto data are not redistributed in the repository.
  # Users should place the original dataset under this directory.
  raw_dir: "data/raw/porto"

  # Output of scripts/prepare_data.py
  processed_dir: "data/processed/porto"

  # Public graph / reachability / feasible-length cache
  cache_dir: "data/cache/porto"

  # PATSyn outputs
  output_dir: "outputs/porto"

  # Evaluation results
  result_dir: "results/porto"

# ------------------------------------------------------------
# Admission / preprocessing statistics
# ------------------------------------------------------------
admission:
  # The formal cohort contains admitted trajectories only.
  # Actual counts/rates are computed by 01_prepare_data.py
  # and written to admission_stats.json.
  record_statistics: true

# ------------------------------------------------------------
# Reproducibility
# ------------------------------------------------------------
reproducibility:
  dataset_id: "porto"
  fixed_cohort_size: 100000